<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生华布行 · 棉针织算料单</title>
<style>
  :root {
    --paper: #f5ebd0;
    --paper-dark: #1a1a22;
    --ink: #2c2c2c;
    --ink-dark: #e0e0e0;
    --line: #d4cec0;
    --line-dark: #2d2d3a;
    --accent: #8b6f47;
    --accent-light: #c4a97d;
    --watermark: rgba(139,111,71,0.06);
    --watermark-dark: rgba(196,169,125,0.05);
    --card: rgba(255,255,255,0.7);
    --card-dark: rgba(30,30,38,0.7);
    --shadow: rgba(0,0,0,0.04);
    --radius: 0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Serif SC', 'STSong', 'SimSun', serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    padding: 20px;
    transition: background 0.4s, color 0.4s;
    position: relative;
  }
  /* 纸张背景纹理 */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    background:
      /* 水印Logo */
      radial-gradient(ellipse at 50% 30%, var(--watermark) 0%, transparent 60%),
      /* 横向虚线格线 */
      repeating-linear-gradient(
        90deg,
        transparent, transparent 8px,
        var(--line) 8px, var(--line) 8.5px,
        transparent 8.5px, transparent 20px
      ),
      /* 横向实线（行距线） */
      repeating-linear-gradient(
        0deg,
        transparent, transparent 35px,
        var(--line) 35px, var(--line) 36px
      );
    opacity: 0.5;
  }
  body.dark {
    --paper: #1a1a22;
    --ink: #e0e0e0;
    --line: #2d2d3a;
    --accent: #c4a97d;
    --card: rgba(30,30,38,0.7);
    --shadow: rgba(0,0,0,0.2);
  }
  body.dark::before {
    background:
      radial-gradient(ellipse at 50% 30%, var(--watermark-dark) 0%, transparent 60%),
      repeating-linear-gradient(90deg, transparent, transparent 8px, var(--line-dark) 8px, var(--line-dark) 8.5px, transparent 8.5px, transparent 20px),
      repeating-linear-gradient(0deg, transparent, transparent 35px, var(--line-dark) 35px, var(--line-dark) 36px);
    opacity: 0.3;
  }
  .app {
    max-width: 960px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }
  /* 顶栏 */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .topbar-actions { display: flex; gap: 8px; }
  .topbar-actions button {
    padding: 6px 14px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .topbar-actions button:hover {
    background: var(--accent);
    color: #fff;
  }

  /* 品牌抬头 */
  .header {
    text-align: center;
    padding: 20px 0 16px;
    position: relative;
  }
  .header::after {
    content: '';
    display: block;
    width: 120px;
    height: 2px;
    background: var(--accent);
    margin: 12px auto 0;
  }
  .header .brand {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 6px;
    color: var(--accent);
  }
  .header .brand-en {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--accent-light);
    margin-top: 2px;
    font-family: 'Times New Roman', serif;
  }
  .header .title {
    font-size: 16px;
    font-weight: 600;
    margin-top: 8px;
    color: var(--ink);
  }

  /* 表单卡片 */
  .sheet {
    background: var(--card);
    backdrop-filter: blur(2px);
    border: 1px solid var(--line);
    padding: 24px;
    margin-bottom: 16px;
    transition: background 0.3s;
    position: relative;
  }
  .sheet-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }
  .sheet-row-2 { grid-template-columns: 1fr 1fr; }
  .sheet-row-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
  .grid-2col {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 16px;
    align-items: start;
  }
  .field-row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  @media (max-width: 700px) {
    .sheet-row, .sheet-row-2, .sheet-row-4, .grid-2col, .field-row-2 {
      grid-template-columns: 1fr;
    }
  }

  /* ── 手机端适配：卡片式布局 ── */
  @media (max-width: 600px) {
    body { padding: 8px; }
    .app { max-width: 100%; }
    .sheet { padding: 12px; }
    .header .brand { font-size: 22px; letter-spacing: 4px; }
    .header .title { font-size: 14px; }
    .topbar { flex-direction: column; align-items: flex-start; gap: 6px; }
    .topbar-actions { flex-wrap: wrap; gap: 4px; }
    .topbar-actions button { font-size: 11px; padding: 5px 10px; }
    .field-row-2 { grid-template-columns: 1fr 1fr; gap: 6px; }

    /* PC表格隐藏，手机卡片显示 */
    .mat-table-wrapper, .cost-table-wrapper { display: none !important; }
    .mat-card-container, .cost-card-container { display: block !important; }

    /* 修复手机输入法弹出问题 */
    input, select, textarea { touch-action: manipulation; }
    .mat-card-field input, .mat-card-field select,
    .cost-card-field input, .cost-card-field select { font-size: 16px !important; }

    .field label { font-size: 11px; }
    .field input, .field select { font-size: 14px; padding: 10px 8px; }
    .add-row-btn { font-size: 12px; padding: 8px 12px; }
    .result-grid { grid-template-columns: 1fr 1fr 1fr; }
    .result-item { padding: 10px; }
    .result-item .value { font-size: 18px; }
    .cost-line-item input { font-size: 14px; padding: 8px; }
    .cost-subtotal, .cost-grand-total { font-size: 14px; padding: 8px 10px; }
    .cost-line-item { flex-wrap: wrap; gap: 6px; padding: 8px 10px; }
    .cost-line-item input { width: 100%; text-align: left; }
  }

  @media (max-width: 420px) {
    .result-grid { grid-template-columns: 1fr; }
    .result-item { padding: 8px; border-right: none; border-bottom: 1px solid var(--accent-light); }
    .result-item:last-child { border-bottom: none; }
  }

  /* ── 手机端原料卡片 ── */
  .mat-card-container { display: none; }
  .mat-card {
    background: var(--card);
    border: 1px solid var(--line);
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .mat-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }
  .mat-card-header .num {
    font-weight: 700;
    color: var(--accent);
    font-size: 13px;
  }
  .mat-card-header .mid-pct {
    font-weight: 700;
    color: var(--accent);
    font-size: 16px;
    flex: 1;
    text-align: center;
  }
  .mat-card-header .del-btn {
    width: 28px; height: 28px;
    border: 1px solid #d4a0a0;
    background: transparent;
    color: #b07070;
    cursor: pointer;
    font-size: 14px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .mat-card-header .del-btn:hover { background: #d4a0a0; color: #fff; }
  .mat-card-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    margin-bottom: 4px;
  }
  .mat-card-row:last-child { margin-bottom: 0; }
  .mat-card-field {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .mat-card-field .mlabel {
    font-size: 11px;
    color: var(--accent-light);
    white-space: nowrap;
  }
  .mat-card-field input, .mat-card-field select {
    padding: 6px 6px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    max-width: 90px;
  }
  .mat-card-field select option {
    background: #f5ebd0;
    color: #1a1a1a;
  }
  .mat-card-field input:focus, .mat-card-field select:focus { border-bottom-color: var(--accent); }
  .mat-card-field .prop-pct {
    font-weight: 700;
    color: var(--accent);
    font-size: 14px;
  }
  .mat-card-field .cm-label {
    font-size: 10px;
    color: var(--accent-light);
  }

  /* ── 手机端成本卡片 ── */
  .cost-card-container { display: none; }
  .cost-card {
    background: var(--card);
    border: 1px solid var(--line);
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .cost-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }
  .cost-card-header .title { font-weight: 600; color: var(--accent); font-size: 13px; }
  .cost-card-header .num { font-weight: 700; color: var(--accent); font-size: 13px; }
  .cost-card-header .del-btn {
    width: 28px; height: 28px;
    border: 1px solid #d4a0a0;
    background: transparent;
    color: #b07070;
    cursor: pointer;
    font-size: 14px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cost-card-header .del-btn:hover { background: #d4a0a0; color: #fff; }
  .cost-card-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    margin-bottom: 3px;
  }
  .cost-card-field {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .cost-card-field .clabel {
    font-size: 11px;
    color: var(--accent-light);
    white-space: nowrap;
  }
  .cost-card-field input, .cost-card-field select {
    padding: 5px 6px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    font-size: 12px;
    font-family: inherit;
    outline: none;
    max-width: 80px;
  }
  .cost-card-field select option {
    background: #f5ebd0;
    color: #1a1a1a;
  }
  .cost-card-field input:focus, .cost-card-field select:focus { border-bottom-color: var(--accent); }
  .cost-card-field .cost-pct {
    font-weight: 700;
    color: var(--accent);
    font-size: 14px;
  }
  .field { margin-bottom: 0; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 3px;
    color: var(--accent);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .field label .hint {
    font-weight: 400;
    color: var(--accent-light);
    font-size: 11px;
  }
  .field input, .field select {
    width: 100%;
    padding: 8px 10px;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--line);
    color: var(--ink);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  .field input:focus, .field select:focus {
    border-bottom-color: var(--accent);
  }
  .field input::placeholder { color: var(--line); font-style: italic; font-size: 12px; }

  /* 材料表格 */
  .mat-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .mat-table th {
    text-align: left;
    padding: 8px 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.5px;
    border-bottom: 2px solid var(--accent-light);
  }
  .mat-table td {
    padding: 6px;
    border-bottom: 1px dashed var(--line);
    vertical-align: middle;
  }
  .mat-table input, .mat-table select {
    width: 100%;
    padding: 6px 4px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    font-size: 13px;
    font-family: inherit;
    outline: none;
  }
  .mat-table select option {
    background: #f5ebd0;
    color: #1a1a1a;
  }
  .mat-table select:focus { border-bottom-color: var(--accent); }
  .mat-table .del-btn {
    width: 28px; height: 28px;
    border: 1px solid #d4a0a0;
    background: transparent;
    color: #b07070;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: all 0.2s;
  }
  .mat-table .del-btn:hover {
    background: #d4a0a0;
    color: #fff;
  }
  .mat-table .prop-cell {
    font-weight: 600;
    color: var(--accent);
    font-size: 12px;
    white-space: nowrap;
  }

  /* 成本模块 */
  .cost-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .cost-table th {
    text-align: left;
    padding: 5px 4px;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    border-bottom: 2px solid var(--accent-light);
  }
  .cost-table td {
    padding: 3px 4px;
    border-bottom: 1px dashed var(--line);
    vertical-align: middle;
  }
  .cost-table input, .cost-table select {
    width: 100%;
    padding: 4px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    font-size: 13px;
    font-family: inherit;
    outline: none;
  }
  .cost-table input:focus, .cost-table select:focus { border-bottom-color: var(--accent); }
  .cost-table select option {
    background: #f5ebd0;
    color: #1a1a1a;
  }
  .cost-table .cost-val {
    font-weight: 600;
    color: var(--accent);
    font-size: 12px;
    text-align: right;
    padding-right: 6px;
  }
  .cost-table .auto-pct {
    font-weight: 600;
    color: var(--accent);
    text-align: center;
    font-size: 12px;
  }
  .cost-subtotal {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    margin-top: 6px;
    background: rgba(139,111,71,0.05);
    border: 1px solid var(--accent-light);
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
  }
  .cost-subtotal span:last-child { color: var(--accent); }
  .cost-line-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    margin-top: 6px;
    border: 1px solid var(--line);
    font-size: 14px;
    color: var(--ink);
  }
  .cost-line-item label { font-weight: 500; color: var(--ink); }
  .cost-line-item input {
    width: 160px;
    padding: 4px 8px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    text-align: right;
  }
  .cost-line-item input:focus { border-bottom-color: var(--accent); }
  .cost-auto {
    background: rgba(139,111,71,0.04);
    border-color: var(--accent-light);
  }
  .cost-auto span:last-child {
    font-weight: 600;
    color: var(--accent);
  }
  .cost-grand-total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    margin-top: 8px;
    background: rgba(139,111,71,0.1);
    border: 2px solid var(--accent);
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
  }
  .cost-grand-total span:last-child { color: var(--accent); }
  .section-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 2px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--accent-light);
  }
  .add-row-btn {
    padding: 6px 16px;
    margin-top: 8px;
    background: transparent;
    border: 1px dashed var(--accent-light);
    color: var(--accent);
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    transition: all 0.2s;
  }
  .add-row-btn:hover {
    background: var(--accent);
    color: #fff;
    border-style: solid;
  }

  /* 结果区 */
  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0;
    border: 1px solid var(--accent-light);
  }
  .result-item {
    padding: 16px;
    text-align: center;
    border-right: 1px solid var(--accent-light);
    border-bottom: 1px solid var(--accent-light);
  }
  .result-item:last-child { border-right: none; }
  .result-item .label {
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .result-item .value {
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    font-family: 'Times New Roman', serif;
  }
  .result-item .value .unit {
    font-size: 12px;
    font-weight: 400;
    color: var(--accent-light);
    margin-left: 2px;
  }

  /* 成分占比条 */
  .prop-bar-wrapper { margin-top: 4px; }
  .prop-bar-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .prop-bar-item .pname {
    font-size: 12px;
    min-width: 50px;
    color: var(--ink);
  }
  .prop-bar-item .ptrack {
    flex: 1;
    height: 14px;
    background: var(--line);
    position: relative;
    overflow: hidden;
  }
  .prop-bar-item .pfill {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s;
  }
  .prop-bar-item .ppct {
    font-size: 11px;
    font-weight: 600;
    min-width: 45px;
    text-align: right;
    color: var(--accent);
  }

  /* 备注 */
  .note {
    font-size: 11px;
    color: var(--accent-light);
    line-height: 1.8;
    margin-top: 12px;
    padding: 12px;
    border: 1px dashed var(--line);
  }

  /* 打印 */
  @media print {
    body { background: #f5ebd0 !important; padding: 0; }
    body::before { display: none !important; }
    .topbar { display: none !important; }
    .sheet { break-inside: avoid; border: 1px solid #ccc; background: #faf7f0; }
    .no-print { display: none !important; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- 顶栏操作 -->
  <div class="topbar">
    <div></div>
    <div class="topbar-actions">
      <button onclick="toggleTheme()">🌓 主题</button>
      <button onclick="resetForm()">↺ 重置</button>
      <button onclick="window.print()">🖨 打印</button>
      <button onclick="exportImage()">📷 导出图片</button>
    </div>
  </div>

  <!-- 品牌抬头 -->
  <div class="header">
    <div class="brand">生 华 布 行</div>
    <div class="brand-en">SHENGHUA FABRIC CO.</div>
    <div class="title">针织核算器</div>
  </div>

  <!-- 左右双栏 -->
  <div class="grid-2col">
    <!-- ====== 左栏：原料 + 成分占比 ====== -->
    <div>
      <div class="sheet">
        <div style="font-size:13px;font-weight:600;color:var(--accent);letter-spacing:1px;margin-bottom:12px;">原 料</div>
    <div class="mat-table-wrapper">
        <table class="mat-table">
          <thead>
            <tr>
              <th style="width:32px;">#</th>
              <th style="width:75px;">规格</th>
              <th style="width:80px;">单位</th>
              <th style="width:95px;">纱长 (100针)</th>
              <th style="width:65px;">路数</th>
              <th style="width:60px;">占比</th>
              <th style="width:32px;"></th>
            </tr>
          </thead>
          <tbody id="matBody"></tbody>
        </table>
    </div>
    <div class="mat-card-container" id="matCardContainer"></div>
        <button class="add-row-btn" onclick="addMaterial()">+ 添加原料</button>
      </div>
    </div>

    <!-- ====== 右栏：机台参数 + 产量结果 ====== -->
    <div>
      <div class="sheet" id="rightPanel">
        <div style="font-size:13px;font-weight:600;color:var(--accent);letter-spacing:1px;margin-bottom:12px;">机 台 参 数</div>
        <div class="field">
          <label>总针数 <span class="hint">Z</span></label>
          <input type="number" id="totalNeedles" placeholder="如 1740" oninput="calcAll();saveCache()">
        </div>
        <div class="field-row-2">
          <div class="field"><label>转速 <span class="hint">r/min</span></label><input type="number" id="speed" placeholder="如 22" step="0.1" oninput="calcAll();saveCache()"></div>
          <div class="field"><label>效率 <span class="hint">0-1</span></label><input type="number" id="efficiency" placeholder="如 0.88" min="0" max="1" step="0.01" oninput="calcAll();saveCache()"></div>
        </div>
        <div class="field-row-2">
          <div class="field"><label>单价 <span class="hint">元/kg</span></label><input type="number" id="unitPrice" placeholder="如 42" step="0.01" oninput="calcAll();saveCache()"></div>
          <div class="field"><label>布重 <span class="hint">kg/圈</span></label><input type="number" id="rollWeight" placeholder="如 25" step="0.1" value="25" oninput="calcAll();saveCache()"></div>
        </div>

        <!-- 产量结果（合并到同一个框） -->
        <div id="resultSheet" style="display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--accent-light);">
          <div style="font-size:12px;font-weight:600;color:var(--accent);letter-spacing:1px;margin-bottom:8px;">产 量 结 果</div>
          <div class="result-grid">
            <div class="result-item">
              <div class="label">日产量</div>
              <div class="value"><span id="dailyYield">0</span><span class="unit">kg</span></div>
            </div>
            <div class="result-item">
              <div class="label">日产值</div>
              <div class="value"><span id="dailyValue">0</span><span class="unit">元</span></div>
            </div>
            <div class="result-item">
              <div class="label">落布圈</div>
              <div class="value"><span id="doffRevol">0</span><span class="unit">圈</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ====== 胚布成本计算模块 ====== -->
  <div class="sheet cost-module" id="costModule" style="margin-top:12px;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div class="section-title" style="margin-bottom:0;border:none;">胚 布 成 本 计 算</div>
      <button onclick="exportCostImage()" style="padding:4px 12px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:12px;cursor:pointer;font-family:inherit;">📷 导出图片</button>
    </div>

    <!-- 客户信息 -->
    <div class="field-row-2" style="margin-top:12px;">
      <div class="field"><label>客户名称</label><input type="text" id="customerName" placeholder="请输入" oninput="saveCostCache()"></div>
      <div class="field"><label>跟单员</label><input type="text" id="follower" placeholder="请输入" oninput="saveCostCache()"></div>
    </div>

    <!-- 原料占比 -->
    <div style="font-size:12px;font-weight:600;color:var(--accent);margin:14px 0 8px;letter-spacing:1px;">原料占比</div>
    <div class="cost-table-wrapper">
    <table class="cost-table">
      <thead>
        <tr>
          <th style="min-width:220px;">材料</th>
          <th style="width:85px;">单位</th>
          <th style="width:85px;">单价(元/吨)</th>
          <th style="width:70px;">占比%</th>
          <th style="width:70px;">欠重</th>
          <th style="width:70px;">织损率%</th>
          <th style="width:90px;">成本(元/吨)</th>
          <th style="width:32px;"></th>
        </tr>
      </thead>
      <tbody id="costBody"></tbody>
    </table>
    </div>
    <div class="cost-card-container" id="costCardContainer"></div>
    <button class="add-row-btn" onclick="addCostMaterial()">+ 添加材料</button>

    <!-- 纱线成本合计 -->
    <div class="cost-subtotal">
      <span>纱线成本合计</span>
      <span><span id="yarnTotalCost">0.00</span> 元/吨</span>
    </div>

    <!-- 织造费 -->
    <div class="cost-line-item">
      <label>织造费 <span style="font-weight:400;color:var(--accent-light);font-size:12px;">元/吨</span></label>
      <input type="number" id="weavingFee" placeholder="如 3500" step="10" oninput="calcCost();saveCostCache()">
    </div>

    <!-- 织损费（自动计算：欠重费+织损材料费） -->
    <div class="cost-line-item cost-auto">
      <label>织损费 <span style="font-weight:400;color:var(--accent-light);font-size:12px;">欠重+织损</span></label>
      <span><span id="lossFeeDisplay">0.00</span> 元/吨</span>
    </div>

    <!-- 网费/其他 -->
    <div class="cost-line-item">
      <label>网费/其他 <span style="font-weight:400;color:var(--accent-light);font-size:12px;">元/吨</span></label>
      <input type="number" id="extraFee" placeholder="如 500" step="10" oninput="calcCost();saveCostCache()">
    </div>

    <!-- 胚布总成本 -->
    <div class="cost-grand-total">
      <span>胚布总成本</span>
      <span><span id="greigeTotalCost">0.00</span> 元/吨</span>
    </div>
  </div>

</div>

<script>
  // ── 材料数据 ──
  let materials = [];
  let idCounter = 0;

  // 纱支换算
  const UNIT_CONV = {
    's': { label: '英支 S', convert: v => v },
    'd_cotton': { label: '丝类 D', convert: d => 5315 / d },
    'd_spandex': { label: '氨纶 D', convert: d => 5200 / d },
  };

  function unitOptions(selected) {
    return Object.entries(UNIT_CONV).map(([k, v]) =>
      `<option value="${k}" ${k===selected?'selected':''}>${v.label}</option>`
    ).join('');
  }

  function addMaterial(spec, unit, yarnLen, luShu) {
    const id = ++idCounter;
    materials.push({
      id, spec: spec ?? '', unit: unit || 's',
      yarnLen: yarnLen ?? '', luShu: luShu ?? '',
      costName: '', price: '', lossRate: '', costPct: '', shortWeight: ''
    });
    renderMats();
    calcAll();
    saveCache();
  }

  function removeMaterial(id) {
    if (materials.length <= 1) return;
    materials = materials.filter(m => m.id !== id);
    renderMats();
    calcAll();
    saveCache();
  }

  function updateMat(id, field, val) {
    const m = materials.find(x => x.id === id);
    if (m) { m[field] = val; }
    calcAll();
    saveCache();
  }

  function renderMats() {
    const isMobile = window.innerWidth <= 600;
    const tbody = document.getElementById('matBody');
    const cardContainer = document.getElementById('matCardContainer');
    if (!tbody || !cardContainer) return;

    // Always render table (hidden on mobile via CSS)
    tbody.innerHTML = materials.map((m, i) => `
      <tr>
        <td style="font-weight:600;color:var(--accent);font-size:12px;">${i + 1}</td>
        <td><input type="number" value="${m.spec}" placeholder="如 32" min="1" step="0.1" onchange="updateMat(${m.id},'spec',this.value)"></td>
        <td><select onchange="updateMat(${m.id},'unit',this.value)">${unitOptions(m.unit)}</select></td>
        <td><input type="number" value="${m.yarnLen}" placeholder="如 28" min="0" step="0.1" onchange="updateMat(${m.id},'yarnLen',this.value)" style="width:calc(100% - 28px);display:inline;"><span style="font-size:10px;color:var(--accent-light);">cm</span></td>
        <td><input type="number" value="${m.luShu}" placeholder="0" min="0" onchange="updateMat(${m.id},'luShu',this.value)"></td>
        <td class="prop-cell" id="prop-${m.id}">—</td>
        <td>${materials.length > 1 ? `<button class="del-btn" onclick="removeMaterial(${m.id})">×</button>` : ''}</td>
      </tr>
    `).join('');

    // Render cards (hidden on desktop via CSS)
    cardContainer.innerHTML = materials.map((m, i) => {
      return `
      <div class="mat-card">
        <div class="mat-card-header">
          <span class="num">#${i + 1}</span>
          <span class="mid-pct" id="propCard-${m.id}">—</span>
          ${materials.length > 1 ? `<button class="del-btn" onclick="removeMaterial(${m.id})">×</button>` : ''}
        </div>
        <div class="mat-card-row">
          <div class="mat-card-field">
            <span class="mlabel">规格</span>
            <input type="number" value="${m.spec}" placeholder="如 32" min="1" step="0.1" onchange="updateMat(${m.id},'spec',this.value)">
          </div>
          <div class="mat-card-field">
            <span class="mlabel">单位</span>
            <select onchange="updateMat(${m.id},'unit',this.value)">${unitOptions(m.unit)}</select>
          </div>
        </div>
        <div class="mat-card-row">
          <div class="mat-card-field">
            <span class="mlabel">纱长</span>
            <input type="number" value="${m.yarnLen}" placeholder="如 28" min="0" step="0.1" onchange="updateMat(${m.id},'yarnLen',this.value)" style="max-width:70px;">
            <span class="cm-label">cm/100针</span>
          </div>
          <div class="mat-card-field">
            <span class="mlabel">路数</span>
            <input type="number" value="${m.luShu}" placeholder="0" min="0" onchange="updateMat(${m.id},'luShu',this.value)" style="max-width:55px;">
          </div>
        </div>
      </div>
    `}).join('');
  }

  // ── 计算 ──
  function calcAll() {
    const mats = materials.map(m => {
      const spec = parseFloat(m.spec) || 0;
      const yarnLen = parseFloat(m.yarnLen) || 0;
      const luShu = parseFloat(m.luShu) || 0;
      if (!spec || !yarnLen) return null;
      const L = yarnLen * 10 / 100;         // 单针纱长(mm)
      const conv = UNIT_CONV[m.unit];
      const S = conv ? conv.convert(spec) : spec;  // 换算后英支
      if (!S || S <= 0) return null;
      const G = (L * 590.5) / (S * 1000);   // 单针重量(g)
      return { ...m, L, S, G, luShu };
    }).filter(r => r !== null);

    if (mats.length === 0) {
      document.getElementById('resultSheet').style.display = 'none';
      return;
    }

    // ── 成分占比（考虑路数）──
    // 每种原料的实际用纱量 = G_i × luShu_i（路数越多，占比越大）
    const weightedG = mats.reduce((s, r) => s + r.G * r.luShu, 0);
    const propEls = mats.map(r => {
      const pct = weightedG > 0 ? (r.G * r.luShu / weightedG * 100) : 0;
      return { label: UNIT_CONV[r.unit]?.label || '', pct, id: r.id };
    });

    // 渲染占比条
    const colors = ['#8b6f47','#c4a97d','#a0865a','#6b5335','#d4bfa0'];
    document.getElementById('propBars').innerHTML = propEls.map((p, i) => `
      <div class="prop-bar-item">
        <span class="pname">${p.label || '原料' + (i+1)}</span>
        <div class="ptrack"><div class="pfill" style="width:${p.pct}%;background:${colors[i%colors.length]};"></div></div>
        <span class="ppct">${p.pct.toFixed(2)}%</span>
      </div>
    `).join('');

    // 更新每个材料的占比单元格（table + card）
    propEls.forEach(p => {
      const el = document.getElementById('prop-' + p.id);
      if (el) el.textContent = p.pct.toFixed(2) + '%';
      const cardEl = document.getElementById('propCard-' + p.id);
      if (cardEl) cardEl.textContent = p.pct.toFixed(2) + '%';
    });

    // ── 产量（需机台参数完整才显示）──
    const Z = parseFloat(document.getElementById('totalNeedles').value) || 0;
    const n = parseFloat(document.getElementById('speed').value) || 0;
    const eta = parseFloat(document.getElementById('efficiency').value) || 0;
    const price = parseFloat(document.getElementById('unitPrice').value) || 0;
    const rollW = parseFloat(document.getElementById('rollWeight').value) || 25;
    const totalLuShu = mats.reduce((s, r) => s + r.luShu, 0);

    const canCalcProduction = Z > 0 && n > 0 && eta > 0 && totalLuShu > 0;

    if (canCalcProduction) {
      // 每转重量 = 各材料(单针G × 该材料路数) × 总针数
      // 物理含义：每路每转织Z针，材料i占了luShu_i路，故材料i每转用纱 = G_i × Z × luShu_i
      // 豆包修正公式（2026-05-13）：
      // G转(g/转) = (G1×路数1 + G2×路数2 + ...) × 总针数
      const G_rev = mats.reduce((s, r) => s + r.G * r.luShu, 0) * Z;
      // Q日(kg/天) = G转 × 转速 × 效率 × 1.44 ÷ 1000
      const Q_day = G_rev * n * eta * 1.44 / 1000;
      // 每天产值
      const val_day = Q_day * price;
      // 落布转数（豆包修正公式）：
      // 日总转数 = 转速 × 60 × 24 × 效率
      // 每转产量(kg/转) = 日产量 ÷ 日总转数
      // 落布转数(圈) = 布重 ÷ 每转产量 = 布重 × 日总转数 ÷ 日产量
      const dailyRevol = n * 60 * 24 * eta;
      const doff = dailyRevol > 0 ? rollW * dailyRevol / Q_day : 0;

      document.getElementById('dailyYield').textContent = Q_day.toFixed(1);
      document.getElementById('dailyValue').textContent = val_day.toFixed(2);
      document.getElementById('doffRevol').textContent = doff.toFixed(1);
    } else {
      document.getElementById('dailyYield').textContent = '—';
      document.getElementById('dailyValue').textContent = '—';
      document.getElementById('doffRevol').textContent = '—';
    }

    document.getElementById('resultSheet').style.display = 'block';
    renderCostTable();
  }

  // ── 胚布成本 ──
  function costUnitOptions(selected) {
    return `<option value="s" ${selected==='s'?'selected':''}>英支 S</option>
            <option value="d_cotton" ${selected==='d_cotton'?'selected':''}>丝类 D</option>
            <option value="d_spandex" ${selected==='d_spandex'?'selected':''}>氨纶 D</option>`;
  }

  function renderCostTable() {
    const tbody = document.getElementById('costBody');
    const cardContainer = document.getElementById('costCardContainer');
    if (!tbody || !cardContainer) return;

    // Table rows
    tbody.innerHTML = materials.map((m, i) => {
      const unit = m.unit || 's';
      return `
        <tr>
          <td><input type="text" value="${m.costName || ''}" placeholder="如 棉纱" onchange="updateCostField(${m.id},'costName',this.value)"></td>
          <td><select onchange="updateCostField(${m.id},'unit',this.value)">${costUnitOptions(unit)}</select></td>
          <td><input type="number" value="${m.price}" placeholder="如 32000" min="0" step="100" onchange="updateCostField(${m.id},'price',this.value)"></td>
          <td><input type="number" value="${m.costPct}" placeholder="如 100" min="0" max="100" step="0.01" onchange="updateCostField(${m.id},'costPct',this.value)"></td>
          <td><input type="number" value="${m.shortWeight}" placeholder="如 0.5" min="0" step="0.01" onchange="updateCostField(${m.id},'shortWeight',this.value)"></td>
          <td><input type="number" value="${m.lossRate}" placeholder="如 1" min="0" max="100" step="0.1" onchange="updateCostField(${m.id},'lossRate',this.value)"></td>
          <td class="cost-val" id="costVal-${m.id}">—</td>
          <td>${materials.length > 1 ? `<button class="del-btn" onclick="removeCostMaterial(${m.id})">×</button>` : ''}</td>
        </tr>
      `;
    }).join('');

    // Card rows
    cardContainer.innerHTML = materials.map((m, i) => {
      const unit = m.unit || 's';
      return `
        <div class="cost-card">
          <div class="cost-card-header">
            <span class="num">#${i + 1}</span>
            ${materials.length > 1 ? `<button class="del-btn" onclick="removeCostMaterial(${m.id})">×</button>` : ''}
          </div>
          <div class="cost-card-row" style="display:flex;justify-content:space-between;">
            <div class="cost-card-field">
              <span class="clabel">材料</span>
              <input type="text" value="${m.costName || ''}" placeholder="如 棉纱" onchange="updateCostField(${m.id},'costName',this.value)" style="min-width:100px;">
            </div>
            <div class="cost-card-field">
              <span class="clabel">单位</span>
              <select onchange="updateCostField(${m.id},'unit',this.value)">${costUnitOptions(unit)}</select>
            </div>
          </div>
          <div class="cost-card-row">
            <div class="cost-card-field">
              <span class="clabel">单价</span>
              <input type="number" value="${m.price}" placeholder="如 32000" min="0" step="100" onchange="updateCostField(${m.id},'price',this.value)" style="max-width:80px;">
            </div>
            <div class="cost-card-field">
              <span class="clabel">占比</span>
              <input type="number" value="${m.costPct}" placeholder="如 100" min="0" max="100" step="0.01" onchange="updateCostField(${m.id},'costPct',this.value)" style="max-width:60px;">
              <span style="font-size:10px;color:var(--accent-light);">%</span>
            </div>
            <div class="cost-card-field">
              <span class="clabel">欠重</span>
              <input type="number" value="${m.shortWeight}" placeholder="如 0.5" min="0" step="0.01" onchange="updateCostField(${m.id},'shortWeight',this.value)" style="max-width:55px;">
            </div>
            <div class="cost-card-field">
              <span class="clabel">织损率</span>
              <input type="number" value="${m.lossRate}" placeholder="如 1" min="0" max="100" step="0.1" onchange="updateCostField(${m.id},'lossRate',this.value)" style="max-width:55px;">
              <span style="font-size:10px;color:var(--accent-light);">%</span>
            </div>
          </div>
          <div class="cost-card-row">
            <div class="cost-card-field">
              <span class="clabel">成本</span>
              <span class="cost-pct" id="costValCard-${m.id}">—</span>
              <span style="font-size:10px;color:var(--accent-light);">元/吨</span>
            </div>
          </div>
        </div>
      `;
    }).join('');
    calcCost();
  }

  function _calcWeightedG() {
    return materials.reduce((s, m) => {
      const spec = parseFloat(m.spec) || 0;
      const yarnLen = parseFloat(m.yarnLen) || 0;
      const luShu = parseFloat(m.luShu) || 0;
      if (!spec || !yarnLen) return s;
      const L = yarnLen * 10 / 100;
      const conv = UNIT_CONV[m.unit];
      const S = conv ? conv.convert(spec) : spec;
      if (!S || S <= 0) return s;
      const G = (L * 590.5) / (S * 1000);
      return s + G * luShu;
    }, 0);
  }

  function _calcPct(m, weightedG) {
    const spec = parseFloat(m.spec) || 0;
    const yarnLen = parseFloat(m.yarnLen) || 0;
    const luShu = parseFloat(m.luShu) || 0;
    if (!weightedG || !spec || !yarnLen) return 0;
    const L = yarnLen * 10 / 100;
    const conv = UNIT_CONV[m.unit];
    const S = conv ? conv.convert(spec) : spec;
    if (!S || S <= 0) return 0;
    const G = (L * 590.5) / (S * 1000);
    return G * luShu / weightedG * 100;
  }

  function addCostMaterial() {
    addMaterial('', 's', '', '');
  }

  function removeCostMaterial(id) {
    if (materials.length <= 1) return;
    materials = materials.filter(m => m.id !== id);
    renderMats();
    calcAll();
    saveCache();
  }

  function updateCostField(id, field, val) {
    const m = materials.find(x => x.id === id);
    if (m) { m[field] = val; }
    renderCostTable();
    calcAll();
    saveCache();
  }

  function calcCost() {
    const weavingFee = parseFloat(document.getElementById('weavingFee').value) || 0;
    const extraFee = parseFloat(document.getElementById('extraFee').value) || 0;
    const rollW = parseFloat(document.getElementById('rollWeight').value) || 25;
    const tonsPerRoll = 1000 / rollW;

    let totalYarnCost = 0;
    // 所有材料共享的欠重和织损率（取第一个材料的）
    const shortW = materials.length > 0 ? (parseFloat(materials[0].shortWeight) || 0) : 0;
    const lossRate = materials.length > 0 ? (parseFloat(materials[0].lossRate) || 0) : 0;

    materials.forEach(m => {
      const price = parseFloat(m.price) || 0;
      const pct = parseFloat(m.costPct) || 0;
      // 材料成本 = (占比/100) × 单价
      const cost = (pct / 100) * price;
      const el = document.getElementById('costVal-' + m.id);
      if (el) el.textContent = cost.toFixed(2);
      const cardEl = document.getElementById('costValCard-' + m.id);
      if (cardEl) cardEl.textContent = cost.toFixed(2);
      totalYarnCost += cost;
    });

    // 欠重费（用加权平均单价）
    // 每吨欠重总重量 = 件数/吨 × 欠重kg/件
    // 加权平均单价(元/kg) = 总纱线成本(元/吨) ÷ 1000
    // 欠重费 = 每吨欠重总重量 × 加权平均单价
    const shortFee = shortW > 0 ? tonsPerRoll * shortW * (totalYarnCost / 1000) : 0;
    // 织损费 = 总纱线成本 × 织损率/100
    const lossMatFee = totalYarnCost * (lossRate / 100);
    const totalLossFee = shortFee + lossMatFee;

    document.getElementById('yarnTotalCost').textContent = totalYarnCost.toFixed(2);
    document.getElementById('lossFeeDisplay').textContent = totalLossFee.toFixed(2);
    const greigeTotal = totalYarnCost + weavingFee + totalLossFee + extraFee;
    document.getElementById('greigeTotalCost').textContent = greigeTotal.toFixed(2);
  }

  // ── 成本导出图片 ──
  function exportCostImage() {
    const el = document.getElementById('costModule');
    if (!window.html2canvas) {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
      s.onload = () => _captureCost(el);
      document.head.appendChild(s);
    } else {
      _captureCost(el);
    }
  }
  function _captureCost(el) {
    html2canvas(el, {
      background: getComputedStyle(document.body).getPropertyValue('--paper'),
      scale: 2, useCORS: true,
    }).then(canvas => {
      const link = document.createElement('a');
      link.download = '生华布行_胚布成本.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  }

  // ── 成本缓存 ──
  function saveCostCache() {
    const data = {
      customerName: document.getElementById('customerName').value,
      follower: document.getElementById('follower').value,
      weavingFee: document.getElementById('weavingFee').value,
      extraFee: document.getElementById('extraFee').value,
    };
    localStorage.setItem('slCostData', JSON.stringify(data));
  }

  function loadCostCache() {
    try {
      const raw = localStorage.getItem('slCostData');
      if (raw) {
        const data = JSON.parse(raw);
        document.getElementById('customerName').value = data.customerName || '';
        document.getElementById('follower').value = data.follower || '';
        document.getElementById('weavingFee').value = data.weavingFee || '';
        document.getElementById('extraFee').value = data.extraFee || '';
      }
    } catch(e) {}
  }

  // ── 主题 ──
  function toggleTheme() {
    document.body.classList.toggle('dark');
    localStorage.setItem('slTheme', document.body.classList.contains('dark') ? 'dark' : 'light');
  }

  // ── 缓存 ──
  function saveCache() {
    const data = {
      materials: materials,
      totalNeedles: document.getElementById('totalNeedles').value,
      speed: document.getElementById('speed').value,
      efficiency: document.getElementById('efficiency').value,
      unitPrice: document.getElementById('unitPrice').value,
      rollWeight: document.getElementById('rollWeight').value,
    };
    localStorage.setItem('slData', JSON.stringify(data));
  }

  function loadCache() {
    try {
      const raw = localStorage.getItem('slData');
      if (raw) {
        const data = JSON.parse(raw);
        document.getElementById('totalNeedles').value = data.totalNeedles || '';
        document.getElementById('speed').value = data.speed || '';
        document.getElementById('efficiency').value = data.efficiency || '';
        document.getElementById('unitPrice').value = data.unitPrice || '';
        document.getElementById('rollWeight').value = data.rollWeight || '25';
        if (data.materials && data.materials.length) {
          materials = data.materials;
          idCounter = materials.reduce((max, m) => Math.max(max, m.id), 0);
          renderMats();
          calcAll();
          setTimeout(renderCostTable, 50);
          return true;
        }
      }
    } catch(e) {}
    return false;
  }

  // ── 重置 ──
  function resetForm() {
    if (!confirm('确定重置所有数据？')) return;
    materials = [];
    idCounter = 0;
    document.getElementById('totalNeedles').value = '';
    document.getElementById('speed').value = '';
    document.getElementById('efficiency').value = '';
    document.getElementById('unitPrice').value = '';
    document.getElementById('rollWeight').value = '25';
    addMaterial('32', 's', '28', '4');
    addMaterial('40', 'd_spandex', '26', '1');
    document.getElementById('resultSheet').style.display = 'none';
    document.getElementById('customerName').value = '';
    document.getElementById('follower').value = '';
    document.getElementById('weavingFee').value = '';
    document.getElementById('extraFee').value = '';
    localStorage.removeItem('slData');
    localStorage.removeItem('slCostData');
  }

  // ── 导出图片 ──
  function exportImage() {
    // 先确保结果可见
    const resultEl = document.getElementById('resultSheet');
    const wasHidden = resultEl.style.display === 'none';
    if (wasHidden) resultEl.style.display = 'block';
    
    // 使用html2canvas
    const el = document.querySelector('.app');
    // 需要加载html2canvas库
    if (!window.html2canvas) {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
      s.onload = () => captureCanvas();
      document.head.appendChild(s);
    } else {
      captureCanvas();
    }
    
    function captureCanvas() {
      html2canvas(el, {
        background: getComputedStyle(document.body).getPropertyValue('--paper'),
        scale: 2,
        useCORS: true,
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = '生华布行_算料单.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        if (wasHidden) resultEl.style.display = 'none';
      });
    }
  }

  // ── 初始化 ──
  // 主题恢复
  if (localStorage.getItem('slTheme') === 'dark') {
    document.body.classList.add('dark');
  }

  if (!loadCache()) {
    addMaterial('32', 's', '28', '4');
    addMaterial('40', 'd_spandex', '26', '1');
  }
  loadCostCache();
  setTimeout(renderCostTable, 100);
  // 手机横竖屏切换时重新渲染
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { renderMats(); renderCostTable(); }, 300);
  });
</script>
</body>
</html>
