<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>生华布行 · 针织核算器</title>
<style>
  :root {
    --paper: #f5ebd0;
    --paper-dark: #1a1a22;
    --ink: #2c2c2c;
    --ink-dark: #e0e0e0;
    --line: #d4cec0;
    --line-dark: #2d2d3a;
    --accent: #8b6f47;
    --accent-light: #c4a97d;
    --watermark: rgba(139,111,71,0.06);
    --watermark-dark: rgba(196,169,125,0.05);
    --card: rgba(255,255,255,0.7);
    --card-dark: rgba(30,30,38,0.7);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Serif SC', 'STSong', 'SimSun', serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    padding: 20px;
    transition: background 0.4s, color 0.4s;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse at 50% 30%, var(--watermark) 0%, transparent 60%),
      repeating-linear-gradient(90deg, transparent, transparent 8px, var(--line) 8px, var(--line) 8.5px, transparent 8.5px, transparent 20px),
      repeating-linear-gradient(0deg, transparent, transparent 35px, var(--line) 35px, var(--line) 36px);
    opacity: 0.5;
  }
  body.dark {
    --paper: #1a1a22; --ink: #e0e0e0; --line: #2d2d3a;
    --accent: #c4a97d; --card: rgba(30,30,38,0.7);
  }
  body.dark::before { opacity: 0.3; }
  .app { max-width: 960px; margin: 0 auto; position: relative; z-index: 1; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .topbar-actions { display: flex; gap: 8px; }
  .topbar-actions button {
    padding: 6px 14px; border: 1px solid var(--accent); background: transparent;
    color: var(--accent); font-size: 12px; cursor: pointer; font-family: inherit; transition: all 0.2s;
  }
  .topbar-actions button:hover { background: var(--accent); color: #fff; }
  .header { text-align: center; padding: 20px 0 16px; position: relative; }
  .header::after { content: ''; display: block; width: 120px; height: 2px; background: var(--accent); margin: 12px auto 0; }
  .header .brand { font-size: 28px; font-weight: 700; letter-spacing: 6px; color: var(--accent); }
  .header .brand-en { font-size: 11px; letter-spacing: 3px; color: var(--accent-light); margin-top: 2px; font-family: 'Times New Roman', serif; }
  .header .title { font-size: 16px; font-weight: 600; margin-top: 8px; color: var(--ink); }
  .sheet { background: var(--card); border: 1px solid var(--line); padding: 16px 20px; margin-bottom: 12px; transition: background 0.3s; }
  .grid-2col { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; align-items: start; }
  .field-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  @media (max-width: 700px) { .grid-2col, .field-row-2 { grid-template-columns: 1fr; } }
  .field { margin-bottom: 0; }
  .field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 3px; color: var(--accent); letter-spacing: 1px; }
  .field label .hint { font-weight: 400; color: var(--accent-light); font-size: 11px; }
  .field input, .field select {
    width: 100%; padding: 8px 10px; background: transparent; border: none; border-bottom: 1.5px solid var(--line);
    color: var(--ink); font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.2s;
  }
  .field input:focus, .field select:focus { border-bottom-color: var(--accent); }
  .field input::placeholder { color: var(--line); font-style: italic; font-size: 12px; }

  /* 材料表格 */
  .mat-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .mat-table th { text-align: left; padding: 8px 6px; font-size: 11px; font-weight: 600; color: var(--accent); letter-spacing: 0.5px; border-bottom: 2px solid var(--accent-light); }
  .mat-table td { padding: 10px 6px; border-bottom: 1px dashed var(--line); vertical-align: middle; }
  .mat-table input, .mat-table select { width: 100%; padding: 8px 4px; background: transparent; border: none; color: var(--ink); font-size: 13px; font-family: inherit; outline: none; line-height: 1.5; }
  .mat-table select option { background: #f5ebd0; color: #1a1a1a; }
  .mat-table select:focus { border-bottom-color: var(--accent); }
  .mat-table .del-btn, .cost-table .del-btn {
    width: 28px; height: 28px; border: 1px solid #d4a0a0; background: transparent; color: #b07070;
    cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: all 0.2s;
  }
  .mat-table .del-btn:hover, .cost-table .del-btn:hover { background: #d4a0a0; color: #fff; }
  .mat-table .prop-cell { font-weight: 600; color: var(--accent); font-size: 12px; white-space: nowrap; }
  .add-row-btn {
    padding: 6px 16px; margin-top: 8px; background: transparent; border: 1px dashed var(--accent-light);
    color: var(--accent); cursor: pointer; font-size: 12px; font-family: inherit; transition: all 0.2s;
  }
  .add-row-btn:hover { background: var(--accent); color: #fff; border-style: solid; }

  /* 结果 */
  .result-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; border: 1px solid var(--accent-light); }
  .result-item { padding: 16px; text-align: center; border-right: 1px solid var(--accent-light); border-bottom: 1px solid var(--accent-light); }
  .result-item:last-child { border-right: none; }
  .result-item .label { font-size: 11px; color: var(--accent); letter-spacing: 1px; margin-bottom: 4px; }
  .result-item .value { font-size: 22px; font-weight: 700; color: var(--ink); font-family: 'Times New Roman', serif; }
  .result-item .value .unit { font-size: 12px; font-weight: 400; color: var(--accent-light); margin-left: 2px; }

  .prop-bar-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .prop-bar-item .pname { font-size: 12px; min-width: 50px; color: var(--ink); }
  .prop-bar-item .ptrack { flex: 1; height: 14px; background: var(--line); overflow: hidden; }
  .prop-bar-item .pfill { height: 100%; background: var(--accent); transition: width 0.3s; }
  .prop-bar-item .ppct { font-size: 11px; font-weight: 600; min-width: 45px; text-align: right; color: var(--accent); }

  /* 成本模块 */
  .section-title { font-size: 14px; font-weight: 600; color: var(--accent); letter-spacing: 2px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--accent-light); }
  .cost-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 6px; }
  .cost-table th { text-align: left; padding: 5px 4px; font-size: 11px; font-weight: 600; color: var(--accent); border-bottom: 2px solid var(--accent-light); }
  .cost-table td { padding: 10px 4px; border-bottom: 1px dashed var(--line); vertical-align: middle; }
  .cost-table input, .cost-table select { width: 100%; padding: 8px 4px; background: transparent; border: none; color: var(--ink); font-size: 13px; font-family: inherit; outline: none; line-height: 1.5; }
  .cost-table input:focus, .cost-table select:focus { border-bottom-color: var(--accent); }
  .cost-table select option { background: #f5ebd0; color: #1a1a1a; }
  .cost-table .cost-val { font-weight: 600; color: var(--accent); font-size: 12px; text-align: right; padding-right: 6px; }
  .cost-subtotal { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; margin-top: 6px; background: rgba(139,111,71,0.05); border: 1px solid var(--accent-light); font-size: 14px; font-weight: 600; color: var(--ink); }
  .cost-subtotal span:last-child { color: var(--accent); }
  .cost-line-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; margin-top: 6px; border: 1px solid var(--line); font-size: 14px; color: var(--ink); }
  .cost-line-item input { width: 160px; padding: 4px 8px; background: transparent; border: none; border-bottom: 1px solid var(--line); color: var(--ink); font-size: 14px; font-family: inherit; outline: none; text-align: right; }
  .cost-line-item input:focus { border-bottom-color: var(--accent); }
  .cost-auto { background: rgba(139,111,71,0.04); border-color: var(--accent-light); }
  .cost-auto span:last-child { font-weight: 600; color: var(--accent); }
  .cost-grand-total { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; margin-top: 8px; background: rgba(139,111,71,0.1); border: 2px solid var(--accent); font-size: 17px; font-weight: 700; color: var(--ink); }
  .cost-grand-total span:last-child { color: var(--accent); }

  @media print {
    body { background: #f5ebd0 !important; padding: 0; }
    body::before { display: none !important; }
    .topbar { display: none !important; }
    .sheet { break-inside: avoid; border: 1px solid #ccc; background: #faf7f0; }
    .no-print { display: none !important; }
  }

  /* ===== 手机端 ===== */
  @media (max-width: 600px) {
    body { padding: 8px; }
    .app { max-width: 100%; }
    .sheet { padding: 10px; }
    .header .brand { font-size: 22px; letter-spacing: 4px; }
    .header .title { font-size: 14px; }
    .topbar { flex-direction: column; align-items: flex-start; gap: 6px; }
    .topbar-actions { flex-wrap: wrap; gap: 4px; }
    .topbar-actions button { font-size: 11px; padding: 5px 10px; }
    .field-row-2 { grid-template-columns: 1fr 1fr; gap: 6px; }
    .grid-2col { grid-template-columns: 1fr; }
    input, select, textarea { touch-action: manipulation; }
    .field label { font-size: 11px; }
    .field input, .field select { font-size: 14px; padding: 10px 8px; }
    .add-row-btn { font-size: 12px; padding: 8px 12px; }
    .result-grid { grid-template-columns: 1fr 1fr 1fr; }
    .result-item { padding: 10px; }
    .result-item .value { font-size: 18px; }
    .cost-subtotal, .cost-grand-total { font-size: 14px; padding: 8px 10px; }
    .cost-line-item { flex-wrap: wrap; gap: 6px; padding: 8px 10px; }
    .cost-line-item input { width: 100%; text-align: left; }
  }
  @media (max-width: 420px) {
    .result-grid { grid-template-columns: 1fr; }
    .result-item { padding: 8px; border-right: none; border-bottom: 1px solid var(--accent-light); }
    .result-item:last-child { border-bottom: none; }
  }

  /* ===== 手机端卡片 ===== */
  .mat-card-container, .cost-card-container { display: none; }
  @media (max-width: 600px) {
    .mat-table-wrapper, .cost-table-wrapper { display: none !important; }
    .mat-card-container, .cost-card-container { display: block !important; }
  }

  .mat-card, .cost-card { background: var(--card); border: 1px solid var(--line); padding: 10px 12px; margin-bottom: 8px; position: relative; z-index: 2; }
  .mat-card-header, .cost-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .mat-card-header .num, .cost-card-header .num { font-weight: 700; color: var(--accent); font-size: 13px; }
  .mat-card-header .mid-pct { font-weight: 700; color: var(--accent); font-size: 16px; flex: 1; text-align: center; }
  .cost-card-header .mid-pct { font-weight: 700; color: var(--accent); font-size: 14px; flex: 1; text-align: right; }
  .card-del {
    width: 28px; height: 28px; border: 1px solid #d4a0a0; background: transparent; color: #b07070;
    cursor: pointer; font-size: 14px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .card-del:hover { background: #d4a0a0; color: #fff; }
  .mat-card-row, .cost-card-row { display: flex; flex-wrap: wrap; gap: 5px 8px; margin-bottom: 6px; }
  .mat-card-row:last-child, .cost-card-row:last-child { margin-bottom: 0; }
  .mc-field { display: flex; align-items: center; gap: 4px; }
  .mc-field .lbl { font-size: 11px; color: var(--accent-light); white-space: nowrap; }
  .mc-field input, .mc-field select {
    padding: 6px; background: transparent; border: none; border-bottom: 1px solid var(--line);
    color: var(--ink); font-size: 16px; font-family: inherit; outline: none; width: auto; min-width: 50px;
  }
  .mc-field select option { background: #f5ebd0; color: #1a1a1a; }
  .mc-field .val { font-weight: 700; color: var(--accent); font-size: 14px; }
  .mc-field .tiny { font-size: 10px; color: var(--accent-light); }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div></div>
    <div class="topbar-actions">
      <button onclick="toggleTheme()">🌓 主题</button>
      <button onclick="resetForm()">↺ 重置</button>
      <button onclick="window.print()">🖨 打印</button>
      <button onclick="exportImage()">📷 导出图片</button>
    </div>
  </div>

  <div class="header">
    <div class="brand">生 华 布 行</div>
    <div class="brand-en">SHENGHUA FABRIC CO.</div>
    <div class="title">针织核算器</div>
  </div>

  <div class="grid-2col">
    <!-- 左栏：成分占比 -->
    <div>
      <div class="sheet">
        <div style="font-size:13px;font-weight:600;color:var(--accent);letter-spacing:1px;margin-bottom:10px;">成分占比</div>
        <div class="mat-table-wrapper">
          <table class="mat-table">
            <thead><tr>
              <th style="width:32px;">#</th><th style="width:75px;">规格</th><th style="width:80px;">单位</th>
              <th style="width:95px;">纱长(100针)</th><th style="width:65px;">路数</th><th style="width:60px;">占比</th><th style="width:32px;"></th>
            </tr></thead>
            <tbody id="matBody"></tbody>
          </table>
        </div>
        <div class="mat-card-container" id="matCardContainer"></div>
        <button class="add-row-btn" onclick="addMaterial('', 's', '', '')">+ 添加原料</button>
      </div>
    </div>

    <!-- 右栏：机台参数 + 产量 -->
    <div>
      <div class="sheet" id="rightPanel">
        <div style="font-size:13px;font-weight:600;color:var(--accent);letter-spacing:1px;margin-bottom:10px;">机 台 参 数</div>
        <div class="field"><label>总针数 <span class="hint">Z</span></label><input type="number" id="totalNeedles" placeholder="如 1740" oninput="calcAll();saveCache()"></div>
        <div class="field-row-2">
          <div class="field"><label>转速 <span class="hint">r/min</span></label><input type="number" id="speed" placeholder="如 22" step="0.1" oninput="calcAll();saveCache()"></div>
          <div class="field"><label>效率 <span class="hint">0-1</span></label><input type="number" id="efficiency" placeholder="如 0.88" min="0" max="1" step="0.01" oninput="calcAll();saveCache()"></div>
        </div>
        <div class="field-row-2">
          <div class="field"><label>单价 <span class="hint">元/kg</span></label><input type="number" id="unitPrice" placeholder="如 42" step="0.01" oninput="calcAll();saveCache()"></div>
          <div class="field"><label>布重 <span class="hint">kg/圈</span></label><input type="number" id="rollWeight" placeholder="如 25" step="0.1" value="25" oninput="calcAll();saveCache()"></div>
        </div>
        <div id="resultSheet" style="margin-top:12px;padding-top:10px;border-top:1px solid var(--accent-light);">
          <div style="font-size:12px;font-weight:600;color:var(--accent);letter-spacing:1px;margin-bottom:6px;">产 量 结 果</div>
          <div class="result-grid">
            <div class="result-item"><div class="label">日产量</div><div class="value"><span id="dailyYield">—</span><span class="unit">kg</span></div></div>
            <div class="result-item"><div class="label">日产值</div><div class="value"><span id="dailyValue">—</span><span class="unit">元</span></div></div>
            <div class="result-item"><div class="label">落布圈</div><div class="value"><span id="doffRevol">—</span><span class="unit">圈</span></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 胚布成本 -->
  <div class="sheet" id="costModule" style="margin-top:12px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div class="section-title" style="margin-bottom:0;border:none;">胚 布 成 本 计 算</div>
      <button onclick="exportCostImage()" style="padding:4px 12px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:12px;cursor:pointer;font-family:inherit;">📷 导出图片</button>
    </div>
    <div class="field-row-2">
      <div class="field"><label>客户名称</label><input type="text" id="customerName" placeholder="请输入" oninput="saveCostCache()"></div>
      <div class="field"><label>跟单员</label><input type="text" id="follower" placeholder="请输入" oninput="saveCostCache()"></div>
    </div>

    <div style="font-size:12px;font-weight:600;color:var(--accent);margin:14px 0 6px;letter-spacing:1px;">原料占比</div>
    <div class="cost-table-wrapper">
      <table class="cost-table">
        <thead><tr>
          <th style="min-width:220px;">材料</th><th style="width:85px;">单位</th><th style="width:85px;">单价(元/吨)</th>
          <th style="width:70px;">占比%</th><th style="width:70px;">欠重</th><th style="width:70px;">织损率%</th>
          <th style="width:90px;">成本(元/吨)</th><th style="width:32px;"></th>
        </tr></thead>
        <tbody id="costBody"></tbody>
      </table>
    </div>
    <div class="cost-card-container" id="costCardContainer"></div>
    <button class="add-row-btn" onclick="addCostMaterial()">+ 添加材料</button>

    <div class="cost-subtotal"><span>纱线成本合计</span><span><span id="yarnTotalCost">0.00</span> 元/吨</span></div>
    <div class="cost-line-item"><label>织造费 <span style="font-weight:400;color:var(--accent-light);font-size:12px;">元/吨</span></label><input type="number" id="weavingFee" placeholder="如 3500" step="10" oninput="calcCost();saveCostCache()"></div>
    <div class="cost-line-item cost-auto"><label>织损费 <span style="font-weight:400;color:var(--accent-light);font-size:12px;">欠重+织损</span></label><span><span id="lossFeeDisplay">0.00</span> 元/吨</span></div>
    <div class="cost-line-item"><label>网费/其他 <span style="font-weight:400;color:var(--accent-light);font-size:12px;">元/吨</span></label><input type="number" id="extraFee" placeholder="如 500" step="10" oninput="calcCost();saveCostCache()"></div>
    <div class="cost-grand-total"><span>胚布总成本</span><span><span id="greigeTotalCost">0.00</span> 元/吨</span></div>
  </div>
</div>

<script>
// ── 数据 ──
let materials = [], idCounter = 0;
let costItems = [], costId = 0;
const UNIT_CONV = {
  's': { label: '英支 S', convert: v => v },
  'd_cotton': { label: '丝类 D', convert: d => 5315 / d },
  'd_spandex': { label: '氨纶 D', convert: d => 5200 / d },
};

// ── 渲染 ──
function uOpt(sel) {
  return Object.entries(UNIT_CONV).map(([k, v]) =>
    `<option value="${k}" ${k===sel?'selected':''}>${v.label}</option>`).join('');
}
function addMaterial(spec, unit, yarnLen, luShu) {
  const id = ++idCounter;
  materials.push({ id, spec: spec ?? '', unit: unit || 's', yarnLen: yarnLen ?? '', luShu: luShu ?? '', costName: '', price: '', lossRate: '', costPct: '', shortWeight: '' });
  renderAll(); saveAll();
}
function removeMaterial(id) {
  if (materials.length <= 1) return;
  materials = materials.filter(m => m.id !== id);
  renderAll(); saveAll();
}
function updateMat(id, field, val) {
  const m = materials.find(x => x.id === id);
  if (m) { m[field] = val; }
  renderAll();
  saveAll();
}

function renderAll() {
  renderMats(); calcAll();
}

function renderMats() {
  const tb = document.getElementById('matBody');
  const cc = document.getElementById('matCardContainer');
  if (!tb || !cc) return;
  const all = materials;

  // PC 表格 — 渲染全部，不过滤
  tb.innerHTML = all.map((m, i) => `
    <tr>
      <td style="font-weight:600;color:var(--accent);font-size:12px;">${i + 1}</td>
      <td><input type="number" value="${m.spec}" placeholder="如 32" min="1" step="0.1" onchange="updateMat(${m.id},'spec',this.value)"></td>
      <td><select onchange="updateMat(${m.id},'unit',this.value)">${uOpt(m.unit)}</select></td>
      <td><input type="number" value="${m.yarnLen}" placeholder="如 28" min="0" step="0.1" onchange="updateMat(${m.id},'yarnLen',this.value)" style="width:calc(100% - 28px);display:inline;"><span style="font-size:10px;color:var(--accent-light);">cm</span></td>
      <td><input type="number" value="${m.luShu}" placeholder="0" min="0" onchange="updateMat(${m.id},'luShu',this.value)"></td>
      <td class="prop-cell" id="prop-${m.id}">—</td>
      <td>${all.length > 1 ? `<button class="del-btn" onclick="removeMaterial(${m.id})">×</button>` : ''}</td>
    </tr>`).join('');

  // 手机卡片 — 渲染全部，不过滤
  cc.innerHTML = all.map((m, i) => `
    <div class="mat-card">
      <div class="mat-card-header">
        <span class="num">#${i + 1}</span>
        <span class="mid-pct">占比 <span id="propCard-${m.id}">—</span></span>
        ${all.length > 1 ? `<button class="card-del" onclick="removeMaterial(${m.id})">×</button>` : ''}
      </div>
      <div class="mat-card-row">
        <div class="mc-field"><span class="lbl">规格</span><input type="number" value="${m.spec}" placeholder="32" min="1" step="0.1" onchange="cardValueChanged(${m.id},'spec',this.value)"></div>
        <div class="mc-field"><span class="lbl">单位</span><select onchange="cardValueChanged(${m.id},'unit',this.value)">${uOpt(m.unit)}</select></div>
      </div>
      <div class="mat-card-row">
        <div class="mc-field"><span class="lbl">纱长</span><input type="number" value="${m.yarnLen}" placeholder="28" min="0" step="0.1" onchange="cardValueChanged(${m.id},'yarnLen',this.value)" style="max-width:65px;"><span class="tiny">cm/100针</span></div>
        <div class="mc-field"><span class="lbl">路数</span><input type="number" value="${m.luShu}" placeholder="0" min="0" onchange="cardValueChanged(${m.id},'luShu',this.value)" style="max-width:50px;"></div>
      </div>
    </div>`).join('');
}

// ── 成分占比 + 产量 ──
// 手机卡片的统一 onchange 处理：只存数据+刷新计算结果，不替换任何 DOM
function cardValueChanged(id, field, val) {
  // 先看 costItems
  const cm = costItems.find(x => x.id === id);
  if (cm) { cm[field] = val; saveCostCache(); updateCostOnly(); return; }
  // 再看 materials
  const m = materials.find(x => x.id === id);
  if (m) { m[field] = val; saveAll(); updateCalcOnly(); return; }
}

// 轻量更新：只刷新计算结果文字，不替换任何输入框（手机端关键！）
function updateCalcOnly() {
  // 成分占比
  const mats = materials.map(m => {
    const spec = parseFloat(m.spec) || 0, yarnLen = parseFloat(m.yarnLen) || 0, luShu = parseFloat(m.luShu) || 0;
    if (!spec || !yarnLen) return null;
    const L = yarnLen * 10 / 100;
    const conv = UNIT_CONV[m.unit];
    const S = conv ? conv.convert(spec) : spec;
    if (!S || S <= 0) return null;
    const G = (L * 590.5) / (S * 1000);
    return { id: m.id, G, luShu };
  }).filter(r => r !== null);

  if (mats.length > 0) {
    const weightedG = mats.reduce((s, r) => s + r.G * r.luShu, 0);
    mats.forEach(r => {
      const pct = weightedG > 0 ? (r.G * r.luShu / weightedG * 100) : 0;
      const el = document.getElementById('prop-' + r.id);
      if (el) el.textContent = pct.toFixed(2) + '%';
      const ce = document.getElementById('propCard-' + r.id);
      if (ce) ce.textContent = pct.toFixed(2) + '%';
    });

    // 产量
    const Z = parseFloat(document.getElementById('totalNeedles').value) || 0;
    const n = parseFloat(document.getElementById('speed').value) || 0;
    const eta = parseFloat(document.getElementById('efficiency').value) || 0;
    const price = parseFloat(document.getElementById('unitPrice').value) || 0;
    const rollW = parseFloat(document.getElementById('rollWeight').value) || 25;
    const totalLuShu = mats.reduce((s, r) => s + r.luShu, 0);
    if (Z > 0 && n > 0 && eta > 0 && totalLuShu > 0) {
      const G_rev = mats.reduce((s, r) => s + r.G * r.luShu, 0) * Z;
      const Q_day = G_rev * n * eta * 1.44 / 1000;
      const val_day = Q_day * price;
      const dailyRevol = n * 60 * 24 * eta;
      const doff = dailyRevol > 0 ? rollW * dailyRevol / Q_day : 0;
      document.getElementById('dailyYield').textContent = Q_day.toFixed(1);
      document.getElementById('dailyValue').textContent = val_day.toFixed(2);
      document.getElementById('doffRevol').textContent = doff.toFixed(1);
    }
  }

  // 成本
  calcCost();
}
function calcAll() {
  const mats = materials.map(m => {
    const spec = parseFloat(m.spec) || 0, yarnLen = parseFloat(m.yarnLen) || 0, luShu = parseFloat(m.luShu) || 0;
    if (!spec || !yarnLen) return null;
    const L = yarnLen * 10 / 100;
    const conv = UNIT_CONV[m.unit];
    const S = conv ? conv.convert(spec) : spec;
    if (!S || S <= 0) return null;
    const G = (L * 590.5) / (S * 1000);
    return { ...m, L, S, G, luShu };
  }).filter(r => r !== null);

  const rs = document.getElementById('resultSheet');
  if (!rs) return;
  rs.style.display = 'block';

  if (mats.length === 0) {
    document.getElementById('dailyYield').textContent = '—';
    document.getElementById('dailyValue').textContent = '—';
    document.getElementById('doffRevol').textContent = '—';
    return;
  }

  // 成分占比
  const weightedG = mats.reduce((s, r) => s + r.G * r.luShu, 0);
  mats.forEach(r => {
    const pct = weightedG > 0 ? (r.G * r.luShu / weightedG * 100) : 0;
    const el = document.getElementById('prop-' + r.id);
    if (el) el.textContent = pct.toFixed(2) + '%';
    const ce = document.getElementById('propCard-' + r.id);
    if (ce) ce.textContent = pct.toFixed(2) + '%';
  });

  // 产量
  const Z = parseFloat(document.getElementById('totalNeedles').value) || 0;
  const n = parseFloat(document.getElementById('speed').value) || 0;
  const eta = parseFloat(document.getElementById('efficiency').value) || 0;
  const price = parseFloat(document.getElementById('unitPrice').value) || 0;
  const rollW = parseFloat(document.getElementById('rollWeight').value) || 25;
  const totalLuShu = mats.reduce((s, r) => s + r.luShu, 0);

  if (Z > 0 && n > 0 && eta > 0 && totalLuShu > 0) {
    const G_rev = mats.reduce((s, r) => s + r.G * r.luShu, 0) * Z;
    const Q_day = G_rev * n * eta * 1.44 / 1000;
    const val_day = Q_day * price;
    const dailyRevol = n * 60 * 24 * eta;
    const doff = dailyRevol > 0 ? rollW * dailyRevol / Q_day : 0;
    document.getElementById('dailyYield').textContent = Q_day.toFixed(1);
    document.getElementById('dailyValue').textContent = val_day.toFixed(2);
    document.getElementById('doffRevol').textContent = doff.toFixed(1);
  } else {
    document.getElementById('dailyYield').textContent = '—';
    document.getElementById('dailyValue').textContent = '—';
    document.getElementById('doffRevol').textContent = '—';
  }
}

// ── 成本模块 ──
function addCostMaterial() {
  const id = ++costId;
  costItems.push({ id, costName: '', unit: 's', price: '', costPct: '', shortWeight: '', lossRate: '' });
  renderCostTable();
  saveCostCache();
}
function removeCostMaterial(id) {
  if (costItems.length <= 1) return;
  costItems = costItems.filter(c => c.id !== id);
  renderCostTable();
  saveCostCache();
}

function updateCostField(id, field, val) {
  const m = costItems.find(x => x.id === id);
  if (m) { m[field] = val; }
  renderCostTable();
  saveCostCache();
}

function renderCostTable() {
  const tb = document.getElementById('costBody');
  const cc = document.getElementById('costCardContainer');
  if (!tb || !cc) return;

  // PC 表格 — 用 costItems 而非 materials！
  tb.innerHTML = costItems.map((c, i) => `
    <tr>
      <td><input type="text" value="${c.costName || ''}" placeholder="如 棉纱" onchange="updateCostField(${c.id},'costName',this.value)"></td>
      <td><select onchange="updateCostField(${c.id},'unit',this.value)">${uOpt(c.unit)}</select></td>
      <td><input type="number" value="${c.price}" placeholder="如 32000" min="0" step="100" onchange="updateCostField(${c.id},'price',this.value)"></td>
      <td><input type="number" value="${c.costPct}" placeholder="如 100" min="0" max="100" step="0.01" onchange="updateCostField(${c.id},'costPct',this.value)"></td>
      <td><input type="number" value="${c.shortWeight}" placeholder="如 0.5" min="0" step="0.01" onchange="updateCostField(${c.id},'shortWeight',this.value)"></td>
      <td><input type="number" value="${c.lossRate}" placeholder="如 1" min="0" max="100" step="0.1" onchange="updateCostField(${c.id},'lossRate',this.value)"></td>
      <td class="cost-val" id="costVal-${c.id}">—</td>
      <td>${costItems.length > 1 ? `<button class="del-btn" onclick="removeCostMaterial(${c.id})">×</button>` : ''}</td>
    </tr>`).join('');

  // 手机卡片 — 用 costItems 而非 materials！
  cc.innerHTML = costItems.map((c, i) => `
    <div class="cost-card">
      <div class="cost-card-header">
        <span class="num">#${i + 1}</span>
        <span class="mid-pct">成本 <span id="costValCard-${c.id}">—</span></span>
        ${costItems.length > 1 ? `<button class="card-del" onclick="removeCostMaterial(${c.id})">×</button>` : ''}
      </div>
      <div class="cost-card-row">
        <div class="mc-field"><span class="lbl">材料</span><input type="text" value="${c.costName || ''}" placeholder="如 棉纱" onchange="cardValueChanged(${c.id},'costName',this.value)" style="min-width:80px;"></div>
        <div class="mc-field"><span class="lbl">单位</span><select onchange="cardValueChanged(${c.id},'unit',this.value)">${uOpt(c.unit)}</select></div>
      </div>
      <div class="cost-card-row">
        <div class="mc-field"><span class="lbl">单价</span><input type="number" value="${c.price}" placeholder="32000" min="0" step="100" onchange="cardValueChanged(${c.id},'price',this.value)" style="max-width:80px;"></div>
        <div class="mc-field"><span class="lbl">占比</span><input type="number" value="${c.costPct}" placeholder="100" min="0" max="100" step="0.01" onchange="cardValueChanged(${c.id},'costPct',this.value)" style="max-width:55px;"><span class="tiny">%</span></div>
      </div>
      <div class="cost-card-row">
        <div class="mc-field"><span class="lbl">欠重</span><input type="number" value="${c.shortWeight}" placeholder="0.5" min="0" step="0.01" onchange="cardValueChanged(${c.id},'shortWeight',this.value)" style="max-width:55px;"></div>
        <div class="mc-field"><span class="lbl">织损率</span><input type="number" value="${c.lossRate}" placeholder="1" min="0" max="100" step="0.1" onchange="cardValueChanged(${c.id},'lossRate',this.value)" style="max-width:55px;"><span class="tiny">%</span></div>
      </div>
    </div>`).join('');
  calcCost();
}

function calcCost() {
  const weavingFee = parseFloat(document.getElementById('weavingFee').value) || 0;
  const extraFee = parseFloat(document.getElementById('extraFee').value) || 0;
  const rollW = parseFloat(document.getElementById('rollWeight').value) || 25;
  const tonsPerRoll = 1000 / rollW;
  let totalYarnCost = 0;
  let totalLossFee = 0;

  costItems.forEach(c => {
    const price = parseFloat(c.price) || 0;
    const pct = parseFloat(c.costPct) || 0;
    const cost = (pct / 100) * price;
    const el = document.getElementById('costVal-' + c.id);
    if (el) el.textContent = cost.toFixed(2);
    const ce = document.getElementById('costValCard-' + c.id);
    if (ce) ce.textContent = cost.toFixed(2);
    totalYarnCost += cost;

    // 每行各自的欠重费 + 织损材料费
    const sw = parseFloat(c.shortWeight) || 0;
    const lr = parseFloat(c.lossRate) || 0;
    if (sw > 0) totalLossFee += tonsPerRoll * sw * (cost / 1000);
    if (lr > 0) totalLossFee += cost * (lr / 100);
  });

  document.getElementById('yarnTotalCost').textContent = totalYarnCost.toFixed(2);
  document.getElementById('lossFeeDisplay').textContent = totalLossFee.toFixed(2);
  document.getElementById('greigeTotalCost').textContent = (totalYarnCost + weavingFee + totalLossFee + extraFee).toFixed(2);
}

// ── 缓存 ──
function saveAll() {
  const data = {
    materials, costItems,
    totalNeedles: document.getElementById('totalNeedles').value,
    speed: document.getElementById('speed').value, efficiency: document.getElementById('efficiency').value,
    unitPrice: document.getElementById('unitPrice').value, rollWeight: document.getElementById('rollWeight').value,
  };
  localStorage.setItem('slData', JSON.stringify(data));
}
function saveCostCache() {
  localStorage.setItem('slCostData', JSON.stringify({
    customerName: document.getElementById('customerName').value, follower: document.getElementById('follower').value,
    weavingFee: document.getElementById('weavingFee').value, extraFee: document.getElementById('extraFee').value,
    costItems
  }));
}
function loadAll() {
  try {
    const raw = localStorage.getItem('slData');
    if (raw) {
      const d = JSON.parse(raw);
      document.getElementById('totalNeedles').value = d.totalNeedles || '';
      document.getElementById('speed').value = d.speed || '';
      document.getElementById('efficiency').value = d.efficiency || '';
      document.getElementById('unitPrice').value = d.unitPrice || '';
      document.getElementById('rollWeight').value = d.rollWeight || '25';
      if (d.materials && d.materials.length) {
        materials = d.materials;
        idCounter = materials.reduce((max, m) => Math.max(max, m.id), 0);
        if (d.costItems && d.costItems.length) {
          costItems = d.costItems;
          costId = costItems.reduce((max, c) => Math.max(max, c.id), 0);
        }
        renderAll();
        renderCostTable();
        return true;
      }
    }
  } catch(e) {}
  return false;
}
function updateCostOnly() {
  renderCostTable();
}
function loadCostCache() {
  try {
    const raw = localStorage.getItem('slCostData');
    if (raw) {
      const d = JSON.parse(raw);
      document.getElementById('customerName').value = d.customerName || '';
      document.getElementById('follower').value = d.follower || '';
      document.getElementById('weavingFee').value = d.weavingFee || '';
      document.getElementById('extraFee').value = d.extraFee || '';
    }
  } catch(e) {}
}

// ── 其他 ──
function resetForm() {
  if (!confirm('确定重置？')) return;
  materials = []; idCounter = 0;
  costItems = []; costId = 0;
  document.getElementById('totalNeedles').value = '';
  document.getElementById('speed').value = '';
  document.getElementById('efficiency').value = '';
  document.getElementById('unitPrice').value = '';
  document.getElementById('rollWeight').value = '25';
  document.getElementById('customerName').value = '';
  document.getElementById('follower').value = '';
  document.getElementById('weavingFee').value = '';
  document.getElementById('extraFee').value = '';
  addMaterial('32', 's', '28', '4');
  addMaterial('40', 'd_spandex', '26', '1');
  addCostMaterial(); addCostMaterial();
  localStorage.removeItem('slData');
  localStorage.removeItem('slCostData');
}
function toggleTheme() {
  document.body.classList.toggle('dark');
  localStorage.setItem('slTheme', document.body.classList.contains('dark') ? 'dark' : 'light');
}
function exportImage() {
  if (!window.html2canvas) {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
    s.onload = () => _capture(document.querySelector('.app'), '生华布行_核算器.png');
    document.head.appendChild(s);
  } else { _capture(document.querySelector('.app'), '生华布行_核算器.png'); }
}
function exportCostImage() {
  if (!window.html2canvas) {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
    s.onload = () => _capture(document.getElementById('costModule'), '生华布行_胚布成本.png');
    document.head.appendChild(s);
  } else { _capture(document.getElementById('costModule'), '生华布行_胚布成本.png'); }
}
function _capture(el, name) {
  html2canvas(el, { background: getComputedStyle(document.body).getPropertyValue('--paper'), scale: 2, useCORS: true })
    .then(c => { const a = document.createElement('a'); a.download = name; a.href = c.toDataURL('image/png'); a.click(); });
}

// ── 启动 ──
if (localStorage.getItem('slTheme') === 'dark') document.body.classList.add('dark');
if (!loadAll()) { addMaterial('32', 's', '28', '4'); addMaterial('40', 'd_spandex', '26', '1'); addCostMaterial(); addCostMaterial(); }
loadCostCache();
let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(updateCalcOnly, 300); });
</script>
